services:
  api:
    build:
      context: .
      args:
        INSTALL_EXTRAS: observability,ml

    environment:
      RAZORTRUST_MODEL_RELEASE_PATH: /app/model-release
      RAZORTRUST_MODEL_PUBLIC_KEY: ${RAZORTRUST_MODEL_PUBLIC_KEY}

      RAZORTRUST_RAZORPAY_ENABLED: ${RAZORTRUST_RAZORPAY_ENABLED}
      RAZORTRUST_RAZORPAY_MODE: ${RAZORTRUST_RAZORPAY_MODE}
      RAZORTRUST_RAZORPAY_KEY_ID: ${RAZORTRUST_RAZORPAY_KEY_ID}
      RAZORTRUST_RAZORPAY_KEY_SECRET: ${RAZORTRUST_RAZORPAY_KEY_SECRET}
      RAZORTRUST_RAZORPAY_WEBHOOK_SECRET: ${RAZORTRUST_RAZORPAY_WEBHOOK_SECRET}
      RAZORTRUST_RAZORPAY_BASE_URL: ${RAZORTRUST_RAZORPAY_BASE_URL}

    volumes:
      - ./artifacts/tier0/model-release:/app/model-release:ro
