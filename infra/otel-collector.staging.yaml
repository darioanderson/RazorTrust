receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter: {check_interval: 1s, limit_mib: 384}
  batch: {}

exporters:
  otlphttp:
    endpoint: ${env:OTEL_EXPORTER_DESTINATION}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp]
